name: Run Clang Tools

on:
  pull_request:

jobs:
  clangify:
    runs-on:
      group: Beefy

    steps:
      - uses: actions/checkout@v3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install clang-tidy script dependencies
        run: |
          python -m pip install --upgrade pip
          pip install colorama click platformio

      - name: Add Clang Tidy deb repo
        uses: myci-actions/add-deb-repo@10
        with:
          repo: deb http://apt.llvm.org/focal/ llvm-toolchain-focal-15 main
          repo-name: clang-tidy
          keys-asc: https://apt.llvm.org/llvm-snapshot.gpg.key

      - name: Install clang-tidy-15
        run: sudo apt-get update && sudo apt install -y clang-tidy-15

      - name: Run clang-tidy
        run: ./scripts/clang-tidy -w --fix --clang-tidy-path=/usr/bin/clang-tidy-15 --clang-apply-replacements-path=/usr/bin/clang-apply-replacements-15

      - uses: DoozyX/clang-format-lint-action@v0.14
        with:
          source: "./src"
          extensions: "hpp,h,cpp,c"
          clangFormatVersion: 14
          inplace: True

      - uses: EndBug/add-and-commit@v9
        with:
          add: "src"
          author_name: Clang Robot
          author_email: robot@example.com
          message: "Committing clang-format/clang-tidy changes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
