name: Run Clang Tools

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  clangify:
    runs-on:
      group: Beefy
    container:
      image: espressif/idf:v5.1

    steps:
      - uses: actions/checkout@v3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: "recursive"

      - name: Install tools
        run: |
          . $IDF_PATH/export.sh
          idf_tools.py install esp-clang
          pip install --upgrade pyclang

      # See https://github.com/actions/checkout/issues/1169
      - run: git config --system --add safe.directory /__w/embedded-app/embedded-app
        if: github.event_name == 'pull_request'

      - name: Run clang-tidy
        run: |
          . $IDF_PATH/export.sh
          idf.py clang-check --run-clang-tidy-py scripts/run-clang-tidy.py --run-clang-tidy-options "-fix -header-filter=embedded-app/src/.*" --exclude-paths managed_components --exclude-paths components

      - name: Post errors and warnings as annotations
        run: |
          . $IDF_PATH/export.sh
          pip install requests curlify
          python scripts/parse_warnings.py --filename warnings.txt --title clang-tidy --path_prefix "/__w/embedded-app/embedded-app/"
        env:
          PR_GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'

      - uses: DoozyX/clang-format-lint-action@v0.16.2
        with:
          source: "./src"
          extensions: "hpp,h,cpp,c"
          clangFormatVersion: 15
          inplace: True

      - uses: EndBug/add-and-commit@v9
        with:
          add: "src"
          author_name: Clang Robot
          author_email: robot@example.com
          message: "Committing clang-format/clang-tidy changes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'
