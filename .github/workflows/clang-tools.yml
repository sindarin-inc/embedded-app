name: Run Clang Tools

on:
  pull_request:

jobs:
  clangify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          cache: "pip"
          cache-dependency-path: "**/requirements-dev.txt"

      - name: Install clang-tidy script dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Install SDL
        run: sudo apt update && sudo apt install -y libsdl2-dev

      - name: Install clang-tidy-12
        run: sudo apt-get update && sudo apt install -y clang-tidy-12

      - name: Run clang-tidy
        run: ./scripts/clang-tidy -w --fix --clang-tidy-path=/usr/bin/clang-tidy-12 --clang-apply-replacements-path=/usr/bin/clang-apply-replacements-12

        # Run clang-tidy with the simulator to post warnings
      - name: Generage compile_commands.json
        run: |
          pio run -e simulator -t compiledb

      - name: cat compile_commands.json
        run: |
          cat .pio/build/simulator/compile_commands.json

      - uses: ZedThree/clang-tidy-review@v0.8.2
        id: review
        with:
          build_dir: .pio/build/simulator
          config_file: .clang-tidy
          apt_packages: libsdl2-dev
      # If there are any comments, fail the check
      - if: steps.review.outputs.total_comments > 0
        run: exit 1

      - uses: DoozyX/clang-format-lint-action@v0.12
        with:
          source: "./src"
          extensions: "hpp,h,cpp,c"
          clangFormatVersion: 12
          inplace: True

      - uses: EndBug/add-and-commit@v4
        with:
          author_name: Clang Robot
          author_email: robot@example.com
          message: "Committing clang-format/clang-tidy changes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
