on:
  workflow_call:
    secrets:
      sol-auth-tolkien:
        required: true
      slack-webhook-url:
        required: true

jobs:
  release:
    name: "Release"
    if: contains(github.ref, 'refs/tags/release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        id: download
        uses: actions/download-artifact@v3
        with:
          name: embedded-app-${{ github.sha }}-IDFv5.1
          path: embedded-app-${{ github.sha }}-IDFv5.1

      - name: Create release
        run: |
          TAG_NAME="${{ github.ref }}"
          VERSION=${TAG_NAME#refs/tags/release/v}
          curl -X POST 'https://api.sindarin.com/firmware/' \
          -H "Authorization: Tolkien ${{ secrets.sol-auth-tolkien }}" \
          -F "version=$VERSION" \
          -F "file=@${{ steps.download.outputs.download-path }}/embedded-app.bin;type=application/octet-stream" \
          -F "elf=@${{ steps.download.outputs.download-path }}/embedded-app.elf;type=application/octet-stream" \
          -F "role=DEBUG" \
          -F "device=GLASSES" \
          -F "release_notes=TODO"

      - name: Create the flasher script
        run: echo "esptool.py -b 460800 --before default_reset --after hard_reset --chip esp32s3  write_flash --flash_mode dio --flash_size 64MB --flash_freq 80m 0x0 bootloader/bootloader.bin 0x8000 partition_table/partition-table.bin 0xe000 ota_data_initial.bin 0x10000 embedded-app.bin" > embedded-app-${{ github.sha }}-IDFv5.1/flash.sh

      - name: Zip back up the build
        run: zip -r embedded-app-${{ github.sha }}-IDFv5.1.zip embedded-app-${{ github.sha }}-IDFv5.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: embedded-app-${{ github.sha }}-IDFv5.1.zip

      - name: Notify Slack
        run: |
          TAG_NAME="${{ github.ref }}"
          VERSION=${TAG_NAME#refs/tags/release/v}
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"New release $VERSION has been uploaded. See it at https://api.sindarin.com/admin/devices/firmwaredownload/\"}" \
          ${{ secrets.slack-webhook-url }}
