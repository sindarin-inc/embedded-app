name: Python

on:
  pull_request:
    paths:
      - "**.py"

jobs:
  format:
    name: "Format Python Code"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort

      - name: Sort imports
        run: |
          # stop the build if there are Python syntax errors or undefined names
          isort --skip=components --profile black .
          isort --skip=components --profile black --check --diff .

      - name: Format with black
        run: |
          # format the files with black
          black --line-length 110 --exclude='components' .

      - name: "Commit changes if necessary"
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin ${{ github.head_ref }}
          echo "HEAD: $(git rev-parse HEAD)"
          echo "UPSTREAM: $(git rev-parse @{u})"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse @{u})" ]; then
            echo "Newer changes detected on branch. Skipping commit."
            exit 0
          fi
          if git diff --exit-code '*.py' > /dev/null; then
            echo "No changes to commit"
          else
            git config --global user.name "Python Formatting Robot"
            git config --global user.email "robot@sindarin.com"
            git add '*.py'
            git commit -m "Committing black python code formatter and isort changes"
            git push origin HEAD:${{ github.head_ref }}
          fi
