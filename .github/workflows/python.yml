name: Python

on:
  pull_request:
    paths:
      - "**.py"

jobs:
  format:
    name: "Format Python Code"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort

      - name: Sort imports
        run: |
          # stop the build if there are Python syntax errors or undefined names
          isort --skip=components --skip=.pio --profile black .
          isort --skip=components --skip=.pio --profile black --check --diff .

      - name: Format with black
        run: |
          # format the files with black
          black --line-length 110 --exclude='components|.pio' .

      - uses: EndBug/add-and-commit@v9
        with:
          add: "*.py"
          author_name: Python Formatting Robot
          author_email: robot@sindarin.com
          message: "Committing black python code formatter and isort changes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
