name: In-Circuit Tester

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # TODO: Could be good to separate out the build and the test steps.
  # Build can happen just fine on the cloud, but testing must happen on our self-hosted runner.
  test:
    name: "Run ICT Test"
    runs-on:
      group: ICT
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      # NOTE: This depends on the correct version of IDF being pre-installed on the tester laptops.

      - name: Install PPK2
        run: |
          source ~/esp/esp-idf/export.sh
          pip install ppk2_api

      - name: Build firmware
        run: |
          source ~/esp/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Run PyTest
        run: |
          source ~/esp/esp-idf/export.sh
          pytest
