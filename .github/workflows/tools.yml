name: Tools

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "release/v*"

jobs:
  build:
    name: "Build epub-render tool"
    runs-on:
      # For some reason, just running on normal ubuntu-latest gets stuck during linking
      group: Beefy

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      # Build scripts/epub-render with cmake
      - name: Build epub-render
        run: |
          cd scripts/epub-render
          mkdir -p build
          cd build
          cmake ..
          make -j

      - name: Upload binaries
        uses: actions/upload-artifact@v3
        with:
          name: esp-render-${{ github.sha }}
          path: scripts/epub-render/build/epub-render
