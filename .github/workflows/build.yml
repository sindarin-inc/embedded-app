name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "release/v*"

jobs:
  build:
    name: "Build Simulator"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pioenv:
          # Seems like RISCV ULP compilation is busted in PlatformIO at least for IDF 5.0.1
          - simulator
          # - simulator-wasm

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install SDL
        if: matrix.pioenv == 'simulator'
        run: sudo apt update && sudo apt install -y libsdl2-dev libsdl2-image-dev

      - name: Install Emscripten
        if: matrix.pioenv == 'simulator-wasm'
        uses: mymindstorm/setup-emsdk@v11

      - name: PlatformIO run
        run: pio run -e ${{ matrix.pioenv }}

  build-idf:
    name: "idf.py build"
    runs-on:
      group: Medium
    strategy:
      matrix:
        # Tags from here: https://hub.docker.com/r/espressif/idf/tags
        idf_version:
          - v5.1
          # - latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: esp32s3
          path: .
          command: idf.py build | tee -a build-log.txt

      - name: Post errors and warnings as annotations
        run: |
          pip install requests curlify
          python scripts/parse_warnings.py --filename build-log.txt --title build --path_prefix "/app/sindarin-inc/embedded-app/"
        env:
          PR_GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'

      - name: Upload binaries
        uses: actions/upload-artifact@v3
        if: github.ref == 'refs/heads/main' || contains(github.ref, 'refs/tags/release/v')
        with:
          name: embedded-app-${{ github.sha }}-IDF${{ matrix.idf_version }}
          path: |
            build/embedded-app.bin
            build/embedded-app.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin

      - name: Release if on a Release tag
        if: contains(github.ref, 'refs/tags/release/v')
        uses: ./.github/workflows/release.yml
