name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: "pio run"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pioenv:
          - sol3dev
          - simulator
          # - simulator-wasm

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install SDL
        if: matrix.pioenv == 'simulator'
        run: sudo apt update && sudo apt install -y libsdl2-dev libsdl2-image-dev

      - name: Install Emscripten
        if: matrix.pioenv == 'simulator-wasm'
        uses: mymindstorm/setup-emsdk@v11

      - name: PlatformIO run
        run: pio run -e ${{ matrix.pioenv }}

      - name: Upload binary firmwares
        uses: actions/upload-artifact@v2
        if: matrix.pioenv == 'sol3dev'
        with:
          name: ${{ matrix.pioenv }}-binaries-${{ github.sha }}
          path: |
            .pio/build/${{ matrix.pioenv }}/*.bin
            .pio/build/${{ matrix.pioenv }}/upload_command.sh

  build-idf:
    name: "idf.py build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@main
        with:
          esp_idf_version: v5.0.1
          target: esp32s3
          path: .

  buildfs:
    name: "pio run -t buildfs"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Create a dummy readable
        run: |
          mkdir -p data
          echo "All that is gold does not glitter" > data/ipsum.txt

      - name: PlatformIO run
        run: pio run -t buildfs
