name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: "pio run"
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: PlatformIO run
      run: pio run -e tinypico -e featheresp32
