name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: "pio run"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pioenv:
          - tinypico
          - featheresp32
          - d1mini32
          - gilpico

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: PlatformIO run
      run: pio run -e ${{ matrix.pioenv }}

    - name: Upload binary firmwares for Gilpico
      uses: actions/upload-artifact@v2
      if: matrix.pioenv == 'gilpico'
      with:
        name: gilpico-binaries
        path: |
          .pio/build/gilpico/*.bin
          .pio/build/gilpico/upload_command.sh
