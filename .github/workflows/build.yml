name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: "pio run"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pioenv:
          - gilpico
          - gilpico-idf
          - gilpico-frankenoscillator
          - glasses
          - glasses-idf
          - optopax-poc4
          - esp-wrover-kit
          - esp-wrover-kit-idf
          - simulator

    steps:
      - name: Check out code
        uses: actions/checkout@v2
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v2

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install SDL
        run: sudo apt update && sudo apt install -y libsdl2-dev libsdl2-image-dev
        if: matrix.pioenv == 'simulator'

      - name: PlatformIO run
        run: pio run -e ${{ matrix.pioenv }}

      - name: Upload binary firmwares
        uses: actions/upload-artifact@v2
        if: matrix.pioenv == 'gilpico' || matrix.pioenv == 'gilpico-frankenoscillator'
        with:
          name: ${{ matrix.pioenv }}-binaries-${{ github.sha }}
          path: |
            .pio/build/${{ matrix.pioenv }}/*.bin
            .pio/build/${{ matrix.pioenv }}/upload_command.sh
