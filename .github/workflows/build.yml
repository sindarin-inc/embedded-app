name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "release/v*"

jobs:
  build-sim:
    name: "Build Simulator"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - sim
          - sim8

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDL
        run: sudo apt update && sudo apt install -y libsdl2-dev libsdl2-image-dev

      - name: build
        run: |
          set -o pipefail
          make ${{ matrix.target }}-build | tee ${{ matrix.target }}-build-log.txt

      - name: Post errors and warnings as annotations
        if: github.event_name == 'pull_request' && (success() || failure())
        run: |
          pip install requests curlify
          python scripts/parse_warnings.py --filename ${{ matrix.target }}-build-log.txt --title ${{ matrix.target }}-build
        env:
          PR_GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-idf:
    name: "Build Firmware"
    runs-on:
      group: Medium
    strategy:
      matrix:
        # Tags from here: https://hub.docker.com/r/espressif/idf/tags
        idf_version:
          - v5.1
          # - latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          target: esp32s3
          path: .
          command: |
            set -o pipefail
            idf.py build | tee build-log.txt

      - name: Post errors and warnings as annotations
        if: github.event_name == 'pull_request' && (success() || failure())
        run: |
          pip install requests curlify
          python scripts/parse_warnings.py --filename build-log.txt --title build --path_prefix "/app/sindarin-inc/embedded-app/"
        env:
          PR_GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the flasher script and bundle everything
        run: |
          mkdir -p artifact
          echo "esptool.py -b 460800 --before default_reset --after hard_reset --chip esp32s3  write_flash --flash_mode dio --flash_size 64MB --flash_freq 80m 0x0 bootloader.bin 0x8000 partition-table.bin 0xe000 ota_data_initial.bin 0x10000 embedded-app.bin" > artifact/flash.sh
          cp build/embedded-app.bin artifact
          cp build/embedded-app.elf artifact
          cp build/bootloader/bootloader.bin artifact
          cp build/partition_table/partition-table.bin artifact
          cp build/ota_data_initial.bin artifact

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: embedded-app-${{ github.sha }}-IDF${{ matrix.idf_version }}
          path: artifact

  build-epub-render:
    name: "Build epub-render"
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      # Build scripts/epub-render with cmake
      - name: Build epub-render
        run: |
          cd scripts/epub-render
          mkdir -p build
          cd build
          cmake ..
          make -j

      - name: Rename binary with Git SHA
        run: |
          cd scripts/epub-render/build
          mv epub-render epub-render-${{ github.sha }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: epub-render-${{ github.sha }}
          path: scripts/epub-render/build/epub-render-${{ github.sha }}

  release:
    if: contains(github.ref, 'refs/tags/release/v')
    name: "Create Release"
    needs: [build-idf, build-epub-render]
    runs-on: ubuntu-latest
    steps:
      - name: Set version
        id: set-version
        run: |
          TAG_NAME="${GITHUB_REF}"
          VERSION=${TAG_NAME#refs/tags/release/v}
          echo "::set-output name=version::$VERSION"

      - name: Download firmware binaries
        id: download-firmware
        uses: actions/download-artifact@v4
        with:
          name: embedded-app-${{ github.sha }}-IDFv5.1
          path: embedded-app-${{ github.sha }}-IDFv5.1

      - name: Download epub-render binaries
        id: download-epub-render
        uses: actions/download-artifact@v4
        with:
          name: epub-render-${{ github.sha }}
          path: epub-render-${{ github.sha }}

      - name: Create firmware release
        run: |
          curl -X POST 'https://api.sindarin.com/firmware/' \
          -H "Authorization: Tolkien ${{ secrets.SOL_AUTH_TOLKIEN }}  " \
          -F "version=${{ steps.set-version.outputs.version }}" \
          -F "file=@${{ steps.download-firmware.outputs.download-path }}/embedded-app.bin;type=application/octet-stream" \
          -F "elf=@${{ steps.download-firmware.outputs.download-path }}/embedded-app.elf;type=application/octet-stream" \
          -F "role=DEBUG" \
          -F "device=GLASSES" \
          -F "git_sha=${{ github.sha }}" \
          -F "release_notes=TODO"

      - name: Create epub-render release
        run: |
          curl -X POST 'https://api.sindarin.com/firmware/' \
          -H "Authorization: Tolkien ${{ secrets.SOL_AUTH_TOLKIEN }}  " \
          -F "version=${{ steps.set-version.outputs.version }}" \
          -F "file=@${{ steps.download-epub-render.outputs.download-path }}/epub-render-${{ github.sha }};type=application/octet-stream" \
          -F "role=DEBUG" \
          -F "device=EPUB_RENDER" \
          -F "git_sha=${{ github.sha }}" \
          -F "release_notes=TODO"

      - name: Zip back up the firmware build
        run: zip -r embedded-app-${{ steps.set-version.outputs.version }}-${{ github.sha }}-IDFv5.1.zip embedded-app-${{ github.sha }}-IDFv5.1

      - name: Rename epub-render binary
        run: |
          mv epub-render-${{ github.sha }}/epub-render-${{ github.sha }} epub-render-${{ github.sha }}/epub-render-linux-${{ steps.set-version.outputs.version }}

      - name: Zip back up the epub-render build
        run: zip -r epub-render-${{ steps.set-version.outputs.version }}-${{ github.sha }}.zip epub-render-${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            embedded-app-${{ steps.set-version.outputs.version }}-${{ github.sha }}-IDFv5.1.zip
            epub-render-${{ steps.set-version.outputs.version }}-${{ github.sha }}.zip

      - name: Notify Slack
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"New release ${{ steps.set-version.outputs.version }} has been uploaded. See it at https://api.sindarin.com/admin/devices/firmwaredownload/\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}
