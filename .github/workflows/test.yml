name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  catch2:
    name: "Catch2"
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build unit tests binary
        run: |
          pio run -e tests

      - name: Run unit tests
        run: |
          ./.pio/build/tests/program --reporter console --reporter junit::out=catch-results.xml

      - name: Test Report
        uses: dorny/test-reporter@v1
        # run this step even if previous step failed
        if: success() || failure()
        with:
          name: Catch2 Tests
          path: catch-results.xml
          reporter: java-junit

      - uses: actions/upload-artifact@v3
        with:
          name: test-images
          path: test/CatchTests/Images/TestRun
