name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  catch2:
    name: "Build and Run Catch2"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Build unit tests binary
        run: |
          make test-build

      - name: Run unit tests
        run: |
          ./test/CatchTests/build/tests --reporter console --reporter junit::out=catch-results-main.xml

      # Because of a FreeRTOS startup/shutdown issue, these must be run separately
      - name: Run epub tests
        run: |
          ./test/CatchTests/build/tests '[epub]' --reporter console --reporter junit::out=catch-results-epub.xml

      - name: Run content-sync tests
        run: |
          ./test/CatchTests/build/tests '[content-sync]' --reporter console --reporter junit::out=catch-results-sync.xml

      - name: Test Report
        uses: dorny/test-reporter@v1
        # run this step even if previous step failed
        if: success() || failure()
        with:
          name: Catch2 Test Results
          path: catch-results-*.xml
          reporter: java-junit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-images
          path: test/CatchTests/Images/TestRun/*.png
