name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  catch2:
    name: "Build and Run Catch2"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Install prerequisites
        run: sudo apt update && sudo apt install -y gdb libfreetype-dev

      - name: Allow gdb to attach to processes
        run: |
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope

      - name: Build unit tests binary
        run: |
          make test-build

      - name: Run timeout test
        run: |
          ./scripts/test_watchdog.sh './test/CatchTests/build/tests [timeout]' 10
        continue-on-error: true

      - name: Run crash test
        run: |
          ./scripts/test_watchdog.sh './test/CatchTests/build/tests [crash]' 10
        continue-on-error: true

      - name: Run unit tests
        run: |
          ./scripts/test_watchdog.sh './test/CatchTests/build/tests --reporter console --reporter junit::out=catch-results-main.xml' 60

      - name: Run epub tests
        run: |
          ./scripts/test_watchdog.sh './test/CatchTests/build/tests [epub] --reporter console --reporter junit::out=catch-results-epub.xml' 60

      - name: Run content-sync tests
        run: |
          ./scripts/test_watchdog.sh './test/CatchTests/build/tests [content-sync] --reporter console --reporter junit::out=catch-results-sync.xml' 60

      - name: Run telemetry tests
        run: |
          ./scripts/test_watchdog.sh './test/CatchTests/build/tests [telemetry] --reporter console --reporter junit::out=catch-results-telemetry.xml' 60

      - name: Test Report
        uses: dorny/test-reporter@v1
        # run this step even if previous step failed
        if: success() || failure()
        with:
          name: Catch2 Test Results
          path: catch-results-*.xml
          reporter: java-junit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-images
          path: test/CatchTests/Images/TestRun/*.png
