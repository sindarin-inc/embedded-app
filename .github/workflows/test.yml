name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  catch2:
    name: "Build and Run Catch2"
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build unit tests binary
        run: |
          pio run -e tests

      - name: Run unit tests
        run: |
          ./.pio/build/tests/program --reporter console --reporter junit::out=catch-results-0.xml

      # Because of a FreeRTOS startup/shutdown issue, these must be run separately
      - name: Run epub tests
        run: |
          ./.pio/build/tests/program '[epub]' --reporter console --reporter junit::out=catch-results-1.xml

      - name: Test Report
        uses: dorny/test-reporter@v1
        # run this step even if previous step failed
        if: success() || failure()
        with:
          name: Catch2 Test Results
          path: catch-results-*.xml
          reporter: java-junit

      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-images
          path: test/CatchTests/Images/TestRun/*.png
