[pytest]
# only the files with prefix `pytest_` would be recognized as pytest test scripts.
python_files = pytest_*.py

# Set traceback to "short" (--tb short) to prevent the overwhelming tracebacks
addopts =
  -s
  --embedded-services esp,idf
  --tb short
  --skip-check-coredump y
  --verbose

markers =
  power: tests which require the Nordic PPK2 to measure power
  ict: tests which require the Mainframe ICT Tester (459-00003-ICT)
  fullsync: tests which perform a wifi content sync

# log related
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# junit related
junit_family = xunit1

## log all to `system-out` when case fail
junit_logging = stdout
junit_log_passing_tests = False
