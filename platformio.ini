; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = gilpico

[env]
platform = https://github.com/platformio/platform-espressif32.git#feature/arduino-idf-master
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.2
	platformio/tool-esptoolpy @ https://github.com/tasmota/esptool/releases/download/v3.2/esptool-v3.2.zip
framework = arduino
build_type = debug
monitor_port = /dev/*usb*
monitor_speed = 115200
# Uncomment to use OTA upload or use the --upload-port at the command line like this:
#   pio run -e gilpico -t upload --upload-port sindarin.local
; upload_port = sindarin.local
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps = 
	olikraus/U8g2@^2.28.8
	olikraus/U8G2_for_Adafruit_GFX@^1.8.0
	ZinggJM/GxEPD2@^1.3.0
	bblanchon/ArduinoJson@^6.17.3
	adafruit/Adafruit BusIO@^1.7.2
	; z3t0/IRremote@^3.1.0
	h2zero/NimBLE-Arduino@^1.3.1
	esphome/Improv@^1.1.0
board_build.partitions = internalflash.csv
build_flags =
	-D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL
	# Use ARDUHAL_LOG_LEVEL_VERBOSE for maximum logging
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D CONFIG_ARDUHAL_LOG_COLORS
    -std=gnu++17
build_unflags =
    -std=gnu++11

[env:gilpico]
board = tinypico
build_flags =
	${env.build_flags}
	-D GILPICO_SINDARIN
board_build.flash_mode=dio
lib_deps =
	${env.lib_deps}
board_build.partitions = externalflash.csv
extra_scripts =
	scripts/pio_external_flash.py
	scripts/pio_binary_export.py

[env:optopax-poc4]
board = tinypico
build_flags =
	${env.build_flags}
	-D GILPICO_SINDARIN
	-D INTERNAL_SPIFFS_FLASH
board_build.flash_mode=dio
lib_deps =
	${env.lib_deps}
	tinypico/TinyPICO Helper Library@^1.4.0
