[platformio]
default_envs = sol3dev

[git]
build_flags =
	!python scripts/get_git_sha.py

[common]
build_type = debug
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
	${git.build_flags}
	-D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL
	# Use ARDUHAL_LOG_LEVEL_VERBOSE for maximum logging
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D CONFIG_ARDUHAL_LOG_COLORS
	-include src/config.h
	# Power consumption goes down by 10mA or so if you disable advertising
	; -D USE_BLE_SERVER_REMOTE=0
	; -D USE_BLE_SERVER_SETTINGS=0
	; -D USE_BLE_SERVER_IMPROV=0
build_unflags =
	-std=gnu++11

[common:idf]
extends = common
# IDF 4.4.1
platform = espressif32@5.1.0
framework =	espidf
# Note: This doesn't have the flash size fix in it, but at least is close to the same version we're using with idf.py
platform_packages = framework-espidf@https://github.com/tasmota/esp-idf/releases/download/v4.4.2/esp-idf-v4.4.2.zip
# Technically none of these libs work with IDF so we need to tell PlatformIO to use them anyways
lib_compat_mode = off
lib_deps =
build_flags =
	${common.build_flags}
build_unflags =
	${common.build_unflags}
	# PlatformIO needs this to be src/config.h
	-includeconfig.h

[common:gilpico]
board = pico32
monitor_port = /dev/*usb*
build_flags =
	-D GILPICO_SINDARIN
	-D BOARD_HAS_PSRAM
board_build.flash_mode=dio
board_build.partitions = externalflash.csv
extra_scripts =
	scripts/generate_manifest.py
	scripts/pio_external_flash.py
	scripts/pio_binary_export.py
	post:scripts/pio_idfota_fix.py

[env:gilpico-idf]
extends = common:idf, common:gilpico
board_build.esp-idf.sdkconfig_path = sdkconfig.gilpico
build_flags =
	${common:idf.build_flags}
	${common:gilpico.build_flags}

# Trae's Rev 7 glasses that don't have the SiTime oscillator
[env:rev7-vanilla]
extends = env:gilpico-idf
build_flags =
	${env:gilpico-idf.build_flags}
	-D LEDC_BACKLIGHT=1
	-D REVISION=7

# John's hacked up board with the dead-bugged SiTime oscillator
# Now also the Rev 7 boards Ty hacked together in the same fashion
# See https://docs.google.com/document/d/1C6eVklsAFGbJDTHxvCPM5ITNt6VVTkgnoY2bQEIUt7s/edit
[env:gilpico-frankenoscillator]
extends = env:gilpico-idf
build_flags =
	${env:gilpico-idf.build_flags}
	# GPIO formerly connected to the TOUCH pin is connected to RST
	-D DISPLAY_RST=27
	# BUSY pin (IO33) is also XN_XP and could mess with the oscillator
	-D DISABLE_BUSY=1
	-D USE_BLE_SERVER_REMOTE=1
	-D USE_BLE_SERVER_SETTINGS=1
	-D USE_BLE_SERVER_IMPROV=1
	-D ULP_BACKLIGHT=1
	-D LEDC_BACKLIGHT=0

[env:glasses-idf]
extends = env:gilpico-idf
build_flags =
	${env:gilpico-idf.build_flags}
	-D REVISION=5

[common:wrover]
board = esp-wrover-kit
; Seems like the second port is the right one. IDF figures this out automatically somehow
monitor_port = /dev/*usb*01
upload_port = /dev/*usb*01
board_build.partitions = internalflash.csv
lib_deps =
	https://github.com/espressif/WROVER_KIT_LCD
build_flags =
	-D DISABLE_LOW_VOLTAGE_HALT=1
	-D WROVER_KIT=1
	-D EINKET013TT1=0
	-D INTERNAL_SPIFFS_FLASH
	-D BOARD_HAS_PSRAM

[env:esp-wrover-kit-idf]
extends = common:idf, common:wrover
board_build.esp-idf.sdkconfig_path = sdkconfig.gilpico
lib_deps =
	${common:idf.lib_deps}
	${common:wrover.lib_deps}
build_flags =
	${env:gilpico-idf.build_flags}
	${common:wrover.build_flags}

[env:sol3dev]
extends = common:idf
board = esp32s3box
board_build.esp-idf.sdkconfig_path = sdkconfig.sol3dev
; debug_tool = esp-prog
; build_type = debug
; debug_init_break = tbreak setup
; monitor_port = /dev/*usb*111*
build_flags =
	${common:idf.build_flags}
	-D BOARD_HAS_PSRAM
	-D DISABLE_BUSY=1
	-D USE_BLE_SERVER_REMOTE=1
	-D USE_BLE_SERVER_SETTINGS=1
	-D USE_BLE_SERVER_IMPROV=1
	-D ULP_BACKLIGHT=0
	-D LEDC_BACKLIGHT=1
	-D USE_LTR329=1
	-D USE_MMC5603=1
	-D INTERNAL_SPIFFS_FLASH=1
	-D DISABLE_LOW_VOLTAGE_HALT=1
	-D DISABLE_POWER_MANAGEMENT=1
board_build.flash_mode=dio
board_build.partitions = esp32s3-32MB.csv
extra_scripts =
	scripts/generate_manifest.py
	scripts/pio_binary_export.py
	post:scripts/pio_idfota_fix.py
	post:scripts/pio_esptool_fix.py

[common:simulator]
; We'll set our own debug flags in platform_build_flags so that they're lldb-friendly
build_unflags =
	-Og
	-g2
	-ggdb2
lib_extra_dirs = 
	lib/Simulator/stubs
	lib
lib_deps = 
	httplib
	HTTPClient
	inifile
	Preferences
	Simulator
	Arduino
	adafruit/Adafruit GFX Library@1.10.13
	bblanchon/ArduinoJson@^6.17.3
lib_compat_mode = off
lib_ldf_mode = off
monitor_filters =
build_flags =
	${git.build_flags}
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D CONFIG_ARDUHAL_LOG_COLORS
	-D DISABLE_LOW_VOLTAGE_HALT=1
	-D DISABLE_POWER_MANAGEMENT=1
	-include src/config.h
extra_scripts = 
	pre:./lib/Simulator/platform_pre_script.py
	post:./lib/Simulator/platform_post_script.py
	scripts/generate_manifest.py

[env:simulator]
extends = common:simulator
platform = native
build_flags =
	!./lib/Simulator/platform_build_flags.py
	${common:simulator.build_flags}

# Because the SimpleBLE library is pre-compiled for macOS, this only works there
[env:simulator-ble]
extends = env:simulator
lib_deps =
	${env:simulator.lib_deps}
	simpleble
build_flags =
	${env:simulator.build_flags}
	-DSIMULATOR_BLE=1
#   -DTT_ADDRESS=\"D05A778A-A8E4-EAC0-2011-5BE51A764456\" # John's TT
	-DTT_ADDRESS=\"589B8A6C-149C-AC80-2B9F-02F94CF7CC20\" # Sol Page Turner (BC)
#	-DTT_ADDRESS_BC=\"34FB44AF-6FA8-37A3-7A5C-37631AD8A921\" # Ben's TT
	-Llib/SimpleBLE
	-lsimpleble
	-Ilib

[env:simulator-wasm]
extends = common:simulator
platform = https://github.com/johnboiles/platformio-platform-wasm.git
build_flags =
	!./lib/Simulator/platform_build_flags.py --wasm
	${common:simulator.build_flags}
