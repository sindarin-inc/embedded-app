; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = tinypico

[env]
# Note: arduino-esp32 seems sensitive to working with a specific version of ESP-IDF.
# You can find the mapping of ESP-IDF version to platform-espressif32 version here:
# https://github.com/platformio/platform-espressif32/releases
# And then you can find a version of arduino-esp32 that works with that version possibly here:
# https://github.com/espressif/arduino-esp32/releases
platform = espressif32@3.4.0 # ESP-IDF 4.3.1
; platform = espressif32@1.12.2 # ESP-IDF 4.0.1
framework =
	arduino
	espidf
platform_packages =
	; framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#2.0.1
	framework-arduinoespressif32 @ https://github.com/marcovannoord/arduino-esp32.git#idf-release/v4.0
build_type = debug
monitor_port = /dev/*usb*
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
monitor_flags = --raw
check_tool = clangtidy
check_flags =
  clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,modernize-* --fix --format-style=file
lib_deps = 
	olikraus/U8g2@^2.28.8
	olikraus/U8G2_for_Adafruit_GFX@^1.8.0
	ZinggJM/GxEPD2@^1.3.0
	bblanchon/ArduinoJson@^6.17.3
	adafruit/Adafruit BusIO@^1.7.2
	z3t0/IRremote@^3.1.0
	h2zero/NimBLE-Arduino@^1.3.1
	amcewen/HTTPClient@^1.2
board_build.partitions = ereader.csv
build_flags =
	-D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D CONFIG_ARDUHAL_LOG_COLORS
	# These need to mirror the ones used by PlatformIO when building for Arduino
	# https://github.com/marcovannoord/arduino-esp32/blob/idf-release/v4.0/tools/platformio-build.py#L101
 	-D ESP32
 	-D ESP_PLATFORM
 	-D MBEDTLS_CONFIG_FILE=\"mbedtls/esp_config.h\"
 	-D ARDUINO=10805
 	-D ARDUINO_ARCH_ESP32

[env:tinypico]
board = esp32dev
build_flags =
	${env.build_flags}
	-D TINYPICO_SINDARIN
board_build.flash_mode=dio
lib_deps =
	${env.lib_deps}
	tinypico/TinyPICO Helper Library@^1.4.0

[env:featheresp32]
board = esp32dev
build_flags =
	${env.build_flags}
	-D HUZZAH32_SINDARIN

# Test board without SPIRAM
[env:d1mini32]
platform = espressif32
board = wemos_d1_mini32
build_flags =
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D CONFIG_ARDUHAL_LOG_COLORS
	-D D1MINI_SINDARIN
	-D DISABLE_WIFI
	-D DISABLE_SPIRAM
	-D ESP32
	-D ESP_PLATFORM
	-D MBEDTLS_CONFIG_FILE=\"mbedtls/esp_config.h\"
	-D ARDUINO=10805
	-D ARDUINO_ARCH_ESP32
