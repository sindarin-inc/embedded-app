; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = tinypico

[env]
platform = espressif32
framework = arduino
build_type = debug
monitor_port = /dev/*usb*
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
monitor_flags = --raw
check_tool = clangtidy
check_flags =
  clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,modernize-* --fix --format-style=file
lib_deps = 
	olikraus/U8g2@^2.28.8
	olikraus/U8G2_for_Adafruit_GFX@^1.8.0
	ZinggJM/GxEPD2@^1.3.0
	bblanchon/ArduinoJson@^6.17.3
	adafruit/Adafruit BusIO@^1.7.2
	z3t0/IRremote@^3.1.0
	h2zero/NimBLE-Arduino@^1.3.1
board_build.partitions = ereader.csv
build_flags =
	-D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D CONFIG_ARDUHAL_LOG_COLORS

[env:tinypico]
board = tinypico
build_flags =
	${env.build_flags}
	-D TINYPICO_SINDARIN
board_build.flash_mode=dio
lib_deps =
	${env.lib_deps}
	tinypico/TinyPICO Helper Library@^1.4.0

[env:featheresp32]
board = featheresp32
build_flags =
	${env.build_flags}
	-DHUZZAH32_SINDARIN
