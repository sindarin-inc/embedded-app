[platformio]
default_envs = sol3dev

[common]
build_type = debug
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
	-D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL
	# Use ARDUHAL_LOG_LEVEL_VERBOSE for maximum logging
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D CONFIG_ARDUHAL_LOG_COLORS
	-include src/config.h
	# Power consumption goes down by 10mA or so if you disable advertising
	; -D USE_BLE_SERVER_REMOTE=0
	; -D USE_BLE_SERVER_SETTINGS=0
	; -D USE_BLE_SERVER_IMPROV=0
build_unflags =
	-std=gnu++11

[common:idf]
extends = common
# IDF 5.0.1
platform = platformio/espressif32@^6.1.0
; platform = https://github.com/tasmota/platform-espressif32/releases/download/2023.01.01/platform-espressif32.zip
framework =	espidf
# Note: This doesn't have the flash size fix in it, but at least is close to the same version we're using with idf.py
; platform_packages = framework-espidf@https://github.com/tasmota/esp-idf/releases/download/v4.4.3.20230129/esp-idf-v4.4.3.zip
# Technically none of these libs work with IDF so we need to tell PlatformIO to use them anyways
lib_compat_mode = off
lib_deps =
board_build.filesystem = littlefs
build_flags =
	${common.build_flags}
build_unflags =
	${common.build_unflags}
	# PlatformIO needs this to be src/config.h
	-includeconfig.h

; [common:wrover]
; board = esp-wrover-kit
; ; Seems like the second port is the right one. IDF figures this out automatically somehow
; monitor_port = /dev/*usb*01
; upload_port = /dev/*usb*01
; board_build.partitions = internalflash.csv
; lib_deps =
; 	https://github.com/espressif/WROVER_KIT_LCD
; build_flags =
; 	-D DISABLE_LOW_VOLTAGE_HALT=1
; 	-D WROVER_KIT=1
; 	-D EINKET013TT1=0
; 	-D INTERNAL_SPIFFS_FLASH
; 	-D BOARD_HAS_PSRAM

; [env:esp-wrover-kit-idf]
; extends = common:idf, common:wrover
; board_build.esp-idf.sdkconfig_path = sdkconfig.gilpico
; lib_deps =
; 	${common:idf.lib_deps}
; 	${common:wrover.lib_deps}
; build_flags =
; 	${env:gilpico-idf.build_flags}
; 	${common:wrover.build_flags}

[env:sol3dev]
extends = common:idf
board = esp32s3box
board_build.esp-idf.sdkconfig_path = sdkconfig.pio
board_upload.flash_size=64MB
; debug_tool = esp-prog
; build_type = debug
; debug_init_break = tbreak setup
; monitor_port = /dev/*usb*111*
build_flags =
	${common:idf.build_flags}
	-D BOARD_HAS_PSRAM
	-D DISABLE_BUSY=1
	-D USE_BLE_SERVER_REMOTE=1
	-D USE_BLE_SERVER_SETTINGS=1
	-D USE_BLE_SERVER_IMPROV=1
	-D LEDC_BACKLIGHT=1
	-D USE_LTR329=1
	-D USE_MMC5603=1
	-D INTERNAL_SPIFFS_FLASH=1
	-D DISABLE_LOW_VOLTAGE_HALT=1
	-D DISABLE_POWER_MANAGEMENT=1
board_build.flash_mode=dio
board_build.partitions = esp32s3-64MB.csv
extra_scripts =
	scripts/generate_manifest.py
	scripts/pio_binary_export.py
	post:scripts/pio_idfota_fix.py
	post:scripts/pio_esptool_fix.py

[common:simulator]
; We'll set our own debug flags in platform_build_flags so that they're lldb-friendly
build_unflags =
	-Og
	-g2
	-ggdb2
lib_extra_dirs = 
	lib/Simulator/stubs
	lib
	components
lib_deps = 
	httplib
	libb64
	inifile
	esp-idf
	https://github.com/sindarin-inc/Adafruit-GFX-Library.git
	ArduinoJson
	freertos-posix
	unzipLIB
	nvs_flash
	expat
lib_compat_mode = off
lib_ldf_mode = off
monitor_filters =
build_flags =
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D CONFIG_ARDUHAL_LOG_COLORS
	-D DISABLE_LOW_VOLTAGE_HALT=1
	-D DISABLE_POWER_MANAGEMENT=1
	-include src/config.h
extra_scripts = 
	; pre:scripts/generate_manifest.py
	pre:./lib/Simulator/platform_pre_script.py
	post:./lib/Simulator/platform_post_script.py

[env:simulator]
extends = common:simulator
platform = native@1.2.1
lib_deps =
	${common:simulator.lib_deps}
	Simulator
build_flags =
	!./lib/Simulator/platform_build_flags.py --openssl --sdl
	${common:simulator.build_flags}

# Because the SimpleBLE library is pre-compiled for macOS, this only works there
[env:simulator-ble]
extends = env:simulator
lib_deps =
	${env:simulator.lib_deps}
	Simulator
	simpleble
build_flags =
	${env:simulator.build_flags}
	-DSIMULATOR_BLE=1
#	-DTT_ADDRESS=\"D05A778A-A8E4-EAC0-2011-5BE51A764456\" # John's TT
#	-DTT_ADDRESS=\"BA79EA32-ECC0-A533-8EEA-BD8E14FF5968\" # Sol Page Turner (BC)
#	-DTT_ADDRESS_BC=\"34FB44AF-6FA8-37A3-7A5C-37631AD8A921\" # Ben's TT
	-DTT_ADDRESS=\"C79DC95B-E42C-364C-F47C-32A7BE941F69\" # Sam's apt TT
	-Llib/SimpleBLE
	-lsimpleble
	-Ilib

[env:simulator-wasm]
extends = common:simulator
platform = https://github.com/johnboiles/platformio-platform-wasm.git
lib_deps =
	${env:simulator.lib_deps}
	Simulator
build_flags =
	!./lib/Simulator/platform_build_flags.py --wasm
	${common:simulator.build_flags}
extra_scripts =
	${common:simulator.extra_scripts}
	scripts/generate_manifest.py

[env:tests]
extends = common:simulator
platform = native@1.2.1
lib_extra_dirs =
	${common:simulator.lib_extra_dirs}
	test
lib_deps =
	${common:simulator.lib_deps}
	stb_image
	Catch2
	CatchTests
# Building library archives can cause unit tests to get stripped during linking and
# -Wl,--whole-archive / -Wl,-force_load is complicated to hook up into PlatformIO
lib_archive = false
build_flags =
	!./lib/Simulator/platform_build_flags.py --openssl
	${common:simulator.build_flags}
	-g
