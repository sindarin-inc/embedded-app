## IDF Component Manager Manifest File
dependencies:
  esp_tinyusb:
    version: 1.5.0
  # Should we do this here instead of in components?
  # espressif/freetype: "^2.10.4"
  ## Required IDF version
  idf:
    version: ">=5.1.5"
  esp_lcd_ili9881c:
    version: 1.*
    rules:
      - if: target == esp32p4
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: target == esp32p4
  espressif/esp_hosted:
    version: "*"
    rules:
      - if: target == esp32p4
  miniz:
    path: ../components/miniz
  bmpimage:
    path: ../components/cpp-misc/bmpimage
  defer:
    path: ../components/cpp-misc/defer
  idflog:
    path: ../components/cpp-misc/idflog
  spiram-cpp:
    path: ../components/cpp-misc/spiram-cpp
  stringutil:
    path: ../components/cpp-misc/stringutil
  unzipper:
    path: ../components/cpp-misc/unzipper
  renderer:
    path: ../components/tiny-epub/renderer
  epubfile:
    path: ../components/tiny-epub/epubfile
