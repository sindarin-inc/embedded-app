## IDF Component Manager Manifest File
dependencies:
  esp_tinyusb:
    version: "^1.7.4"
  # Should we do this here instead of in components?
  # espressif/freetype: "^2.10.4"
  ## Required IDF version
  idf:
    version: ">=5.3.3"
  esp_lcd_ili9881c:
    version: 1.*
    rules:
      - if: target == esp32p4
  espressif/esp_wifi_remote:
    version: "0.15.1"
    rules:
      - if: target == esp32p4
  espressif/esp_hosted:
    version: "2.0.10"
    rules:
      - if: target == esp32p4
  icm42670:
    git: https://github.com/sindarin-inc/esp-bsp
    version: icm42670-mreg
    path: components/icm42670
    rules:
      - if: target == esp32p4
