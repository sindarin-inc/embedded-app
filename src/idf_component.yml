## IDF Component Manager Manifest File
dependencies:
  esp_tinyusb:
    version: "^1.7.4"
  # Should we do this here instead of in components?
  # espressif/freetype: "^2.10.4"
  ## Required IDF version
  idf:
    version: ">=5.3.3"
  esp_lcd_ili9881c:
    version: 1.*
    rules:
      - if: target == esp32p4
  espressif/esp_wifi_remote:
    version: "0.15.1"
    rules:
      - if: target == esp32p4
  espressif/esp_hosted:
    version: "2.0.10"
    rules:
      - if: target == esp32p4
  icm42670:
    git: https://github.com/sindarin-inc/esp-bsp
    version: icm42670-mreg
    path: components/icm42670
    rules:
      - if: target == esp32p4
  espressif/esp_new_jpeg:
    version: "^0.6.1"
    rules:
      - if: target == esp32p4
  # Required for WebRTC
  capture_audio_src:
    path: ../../../espressif/esp-webrtc-solution/components/esp_capture/src/impl/capture_audio_src
    rules:
      - if: target == esp32p4
  capture_audio_enc:
    path: ../../../espressif/esp-webrtc-solution/components/esp_capture/src/impl/capture_audio_enc
    rules:
      - if: target == esp32p4
  esp_audio_codec:
    rules:
      - if: target == esp32p4
  render_impl:
    path: ../../../espressif/esp-webrtc-solution/components/av_render/render_impl
    rules:
      - if: target == esp32p4
